<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>staybnb – Bali Stays</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 32 32" width="32" height="32" fill="#FF385C">
        <path d="M16 1C7.2 1 0 8.2 0 17c0 5.4 2.7 10.2 6.9 13.1L16 31l9.1-0.9C29.3 27.2 32 22.4 32 17 32 8.2 24.8 1 16 1zm0 4c6.6 0 12 5.4 12 12 0 4.1-2.1 7.7-5.3 9.8L16 27.5l-6.7-0.7C6.1 24.7 4 21.1 4 17c0-6.6 5.4-12 12-12z"/>
        <path d="M16 8c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4zm0 10c-3.3 0-6 1.8-6 4v2h12v-2c0-2.2-2.7-4-6-4z"/>
      </svg>
      <span class="logo-text">staybnb</span>
    </div>
    <nav class="nav-tabs">
      <button class="nav-tab active" data-tab="stays">Stays</button>
      <button class="nav-tab" data-tab="experiences">Experiences</button>
      <button class="nav-tab" data-tab="online">Online Experiences</button>
    </nav>
    <div class="header-actions">
      <button class="become-host">Become a Host</button>
      <button class="icon-btn" title="Language">🌐</button>
      <button class="icon-btn menu-btn" title="Menu">☰</button>
      <button class="icon-btn profile-btn" title="Profile">👤</button>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="search-container">
    <div class="search-bar">
      <div class="search-field">
        <label>Location</label>
        <input type="text" id="location-input" value="Bali, Indonesia" placeholder="Where are you going?">
      </div>
      <div class="search-divider"></div>
      <div class="search-field">
        <label>Dates</label>
        <input type="text" id="dates-input" value="Oct 12 – Oct 18" readonly>
      </div>
      <div class="search-divider"></div>
      <div class="search-field">
        <label>Guests</label>
        <input type="text" id="guests-input" value="2 guests" readonly>
      </div>
      <button class="search-btn" id="search-btn" aria-label="Search">
        <svg viewBox="0 0 32 32" width="16" height="16" fill="white">
          <path d="M13 3a10 10 0 107.32 16.91l6.39 6.38a1 1 0 001.41-1.41l-6.38-6.39A10 10 0 0013 3zm0 2a8 8 0 110 16 8 8 0 010-16z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters-bar">
    <button class="filter-btn" data-filter="all">Filters</button>
    <button class="filter-btn" data-filter="price">Price</button>
    <button class="filter-btn" data-filter="type">Type of place</button>
    <button class="filter-btn" data-filter="free-cancel">Free cancellation</button>
    <button class="filter-btn" data-filter="wifi">Wifi</button>
    <button class="filter-btn active" data-filter="pool">Pool</button>
    <button class="filter-btn" data-filter="beachfront">Beachfront</button>
    <button class="filter-btn" data-filter="pet">Pet friendly</button>
    <button class="filter-btn" data-filter="kitchen">Kitchen</button>
  </div>

  <!-- Main Content -->
  <main class="main-content">
    <section class="listings-section">
      <div class="results-header">
        <h1 id="results-count">6 stays in Bali</h1>
        <div class="sort-select">
          <label for="sort">Sort by:</label>
          <select id="sort">
            <option value="recommended">Recommended</option>
            <option value="price-low">Price: low to high</option>
            <option value="price-high">Price: high to low</option>
            <option value="rating">Top rated</option>
          </select>
        </div>
      </div>
      <div class="listings-grid" id="listings-grid">
        <!-- Cards injected by JS -->
      </div>
    </section>

    <aside class="map-section">
      <div id="map"></div>
      <div class="map-label">
        <span class="map-pin-icon">📍</span> Seminyak
      </div>
      <button class="map-toggle" id="map-toggle">Map</button>
    </aside>
  </main>

  <!-- Modal for listing details -->
  <div class="modal" id="listing-modal">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <div class="modal-body" id="modal-body">
        <!-- Filled by JS -->
      </div>
    </div>
  </div>

  <!-- Guest picker popup -->
  <div class="popup" id="guests-popup">
    <div class="popup-row">
      <div>
        <strong>Adults</strong>
        <div class="sub">Ages 13+</div>
      </div>
      <div class="counter">
        <button class="counter-btn" data-type="adults" data-action="dec">−</button>
        <span id="adults-count">2</span>
        <button class="counter-btn" data-type="adults" data-action="inc">+</button>
      </div>
    </div>
    <div class="popup-row">
      <div>
        <strong>Children</strong>
        <div class="sub">Ages 2–12</div>
      </div>
      <div class="counter">
        <button class="counter-btn" data-type="children" data-action="dec">−</button>
        <span id="children-count">0</span>
        <button class="counter-btn" data-type="children" data-action="inc">+</button>
      </div>
    </div>
    <div class="popup-row">
      <div>
        <strong>Infants</strong>
        <div class="sub">Under 2</div>
      </div>
      <div class="counter">
        <button class="counter-btn" data-type="infants" data-action="dec">−</button>
        <span id="infants-count">0</span>
        <button class="counter-btn" data-type="infants" data-action="inc">+</button>
      </div>
    </div>
    <button class="popup-done" id="guests-done">Done</button>
  </div>

  <!-- Date picker simple -->
  <div class="popup" id="dates-popup">
    <div class="date-inputs">
      <div>
        <label>Check-in</label>
        <input type="date" id="checkin" value="2025-10-12">
      </div>
      <div>
        <label>Check-out</label>
        <input type="date" id="checkout" value="2025-10-18">
      </div>
    </div>
    <button class="popup-done" id="dates-done">Done</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
